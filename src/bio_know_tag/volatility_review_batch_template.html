<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>高中生物 Label 波动复核台</title>
  <style>
    :root{--ink:#18221e;--muted:#69736d;--paper:#f2eee4;--card:#fffdf7;--line:#d5cfc1;--green:#21664f;--red:#a84738;--amber:#986526;--blue:#315c78;--shadow:0 15px 42px rgba(33,45,39,.11)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 2%,#fff8d9 0,transparent 25%),linear-gradient(135deg,#ece8dc,#f8f5ed 55%,#e5eee8);font-family:"Noto Serif SC","Songti SC",Georgia,serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:25px 21px;border-right:1px solid rgba(65,75,68,.18);background:rgba(249,247,239,.88);backdrop-filter:blur(18px);overflow:auto}.brand{font-size:26px;font-weight:900;line-height:1.12}.brand small{display:block;margin-top:9px;color:var(--muted);font:700 11px/1.5 ui-monospace,monospace;letter-spacing:.09em}.progress{margin:22px 0;padding:17px;border:1px solid var(--line);background:rgba(255,255,255,.65);border-radius:17px}.progress b{font:800 29px/1 ui-monospace,monospace}.progress p{margin:7px 0;color:var(--muted);font-size:12px}.bar{height:7px;background:#dedbd2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#67a884);width:0;transition:.25s}.search{width:100%;border:1px solid var(--line);background:#fffdf8;padding:11px;border-radius:10px}.filter-title{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.13em;margin:19px 0 7px}.filter{display:flex;width:100%;align-items:center;justify-content:space-between;padding:10px 11px;margin:5px 0;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left}.filter.active{background:var(--ink);color:#fff}.filter b{font:700 11px ui-monospace,monospace}.side-actions{display:grid;gap:7px;margin-top:19px}.side-actions button{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fffdf8}.side-actions .primary{background:var(--green);color:#fff;border-color:var(--green)}
    main{padding:27px clamp(18px,3.5vw,55px) 70px;width:100%;max-width:1660px;margin:auto}.topbar{position:sticky;top:0;z-index:8;margin:-27px 0 22px;padding:20px 0 15px;background:linear-gradient(#f4f1e9 72%,transparent);display:flex;align-items:center;justify-content:space-between;gap:14px}.eyebrow{font:900 11px ui-monospace,monospace;color:var(--green);letter-spacing:.11em}.topbar h1{margin:3px 0 0;font-size:clamp(24px,2.5vw,38px);letter-spacing:-1px}.pager{display:flex;align-items:center;gap:7px}.pager button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px}.pager input{width:72px;padding:9px;border:1px solid var(--line);border-radius:10px;text-align:center}.page-grid{display:grid;gap:22px}.card{background:rgba(255,253,247,.96);border:1px solid rgba(117,116,104,.24);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:95px}.card-head{padding:15px 19px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.qid{font:800 13px ui-monospace,monospace}.pill{padding:6px 9px;border-radius:99px;font:800 10px ui-monospace,monospace}.pill.A{background:#dce8ef;color:var(--blue)}.pill.B{background:#f4e7cb;color:var(--amber)}.pill.C{background:#f7e1dc;color:var(--red)}.meta{color:var(--muted);font-size:11px}.body{padding:18px;display:grid;gap:16px}.images{display:grid;grid-template-columns:minmax(0,1fr);gap:15px}.image-box{border:1px solid var(--line);border-radius:14px;padding:9px;background:#fff}.image-box header{font-weight:900;font-size:12px;color:var(--muted);margin:2px 3px 8px}.image-box img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:#f1f1ec;border-radius:9px;cursor:zoom-in}.no-image{padding:55px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.compare{display:grid;grid-template-columns:minmax(0,1fr);gap:15px}.run{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.run.before{border-top:5px solid var(--blue)}.run.after{border-top:5px solid var(--amber)}.run h3{margin:0 0 4px;font-size:16px}.run-sub{font-size:11px;color:var(--muted);margin-bottom:10px}.label-chip{display:block;border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin:7px 0;background:#fbfaf5}.label-chip.only{background:#fff1e5;border-color:#e4b58e}.label-chip.shared{opacity:.7}.label-name{font-weight:900}.label-id{font:10px ui-monospace,monospace;color:var(--muted)}.label-path{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}.empty{padding:14px;color:var(--muted);border:1px dashed var(--line);border-radius:11px}.added{padding:11px;border-radius:12px;background:#f4e7cb;font-size:12px}.review{padding:18px;background:#1d2822;color:#f8f5ec}.review-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.review h2{margin:0;font-size:18px}.review-note{color:#aebbb4;font-size:11px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.choice{border:1px solid #506058;background:#27342e;color:#eef4ef;padding:10px 6px;border-radius:10px}.choice.selected{background:#e9f3ec;color:#153e2f;border-color:#8ec2a6;box-shadow:0 0 0 2px #8ec2a633}.details{display:grid;gap:10px}.review textarea,.review input{width:100%;border:1px solid #58675f;border-radius:10px;background:#131b17;color:#fff;padding:10px}.picker{position:relative}.suggestions{position:absolute;left:0;right:0;top:100%;z-index:12;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:11px;max-height:220px;overflow:auto;box-shadow:var(--shadow)}.suggestions button{display:block;width:100%;border:0;border-bottom:1px solid #eee7da;background:#fff;padding:9px;text-align:left}.selected-correct{display:flex;gap:6px;flex-wrap:wrap}.selected-correct span{background:#dcece4;color:#174b38;padding:6px 8px;border-radius:8px;font-size:11px}.selected-correct button{border:0;background:transparent;color:#a74736;margin-left:4px}.saved{font:11px ui-monospace,monospace;color:#9fc6b1}.hidden{display:none!important}.empty-page{padding:80px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(10,15,12,.9);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.modal img{max-width:96vw;max-height:94vh;object-fit:contain}.modal button{position:absolute;right:20px;top:16px;border:0;background:#fff;border-radius:99px;width:42px;height:42px;font-size:24px}
    @media(max-width:900px){.shell{display:block}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.topbar{position:relative;margin:0 0 18px}.compare,.images{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand">Label 波动复核台<small>50 QUESTIONS / PAGE · IMAGE ONLY</small></div><div class="progress"><b id="progressText">0 / 0</b><p>已审核 / 当前筛选</p><div class="bar"><i id="progressBar"></i></div></div><input class="search" id="searchInput" placeholder="搜索题号或Label…"><div class="filter-title">波动分组</div><button class="filter active" data-group="ALL">全部波动题 <b id="countALL">0</b></button><button class="filter" data-group="A_same_candidate_set">A · 同候选 <b id="countA">0</b></button><button class="filter" data-group="B_candidate_set_expanded_added_not_selected">B · 增候选未选中 <b id="countB">0</b></button><button class="filter" data-group="C_added_legacy_selected">C · 新旧Label被选中 <b id="countC">0</b></button><div class="filter-title">审核状态</div><button class="filter active" data-status="ALL">全部</button><button class="filter" data-status="UNREVIEWED">只看未审核</button><button class="filter" data-status="REVIEWED">只看已审核</button><div class="side-actions"><button class="primary" onclick="downloadJSONL()">导出审核 JSONL</button><button onclick="downloadProgress()">导出进度备份</button><button onclick="importProgress()">导入进度备份</button><button onclick="clearAll()">清空本页审核</button></div><input id="importFile" type="file" accept="application/json" hidden></aside>
<main><div class="topbar"><div><div class="eyebrow" id="positionText">PAGE 0 / 0</div><h1>每页 50 题 · 图片审核</h1></div><div class="pager"><button onclick="movePage(-1)">← 上一页</button><input id="jumpInput" type="number" min="1" onchange="jumpPage(this.value)"><button onclick="movePage(1)">下一页 →</button></div></div><div id="app"></div></main></div>
<div id="modal" class="modal hidden" onclick="closeModal()"><button>×</button><img id="modalImg" alt="图片预览"></div>
<script id="review-data" type="application/json">__REVIEW_DATA__</script><script id="label-catalog" type="application/json">__LABEL_CATALOG__</script>
<script>
const DATA=JSON.parse(document.getElementById('review-data').textContent),CATALOG=JSON.parse(document.getElementById('label-catalog').textContent),PAGE_SIZE=50,STORAGE_KEY='bio-label-volatility-review-v2-image-batch';let reviews=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'),groupFilter='ALL',statusFilter='ALL',query='',filtered=[],page=0;
const GROUP_META={A_same_candidate_set:{short:'A',name:'候选集合未变化'},B_candidate_set_expanded_added_not_selected:{short:'B',name:'增加候选但未选中'},C_added_legacy_selected:{short:'C',name:'新增旧 Label 被选中'}},DECISIONS=[['BOTH_VALID','前后都合理'],['TOP25_VALID','仅纯Top25合理'],['LEGACY_VALID','仅Top25+旧ID合理'],['BOTH_WRONG','两边都有问题'],['UNSURE','无法判断']];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(reviews));renderProgress()}function currentReview(qid){return reviews[qid]||{decision:'',correct_labels:[],note:'',reviewed_at:''}}
function imageBox(url,title){if(!url)return'';return `<div class="image-box"><header>${esc(title)} · 点击放大</header><img loading="lazy" src="${esc(url)}" alt="${esc(title)}" onclick="openModal(this.src)" onerror="this.parentElement.innerHTML='<header>${esc(title)}</header><div class=no-image>图片加载失败</div>'"></div>`}function labelChip(x,only){return `<div class="label-chip ${only?'only':'shared'}"><div class=label-name>${esc(x.label_name)}</div><div class=label-id>${esc(x.label_id)}</div><div class=label-path>${esc(x.label_path)}</div></div>`}function labelList(xs,onlyIds){if(!xs.length)return'<div class=empty>未选择任何 Label</div>';const only=new Set(onlyIds);return xs.map(x=>labelChip(x,only.has(x.label_id))).join('')}
function renderCorrect(qid,ids){return ids.map(id=>{const x=CATALOG.find(v=>v.label_id===id)||{label_id:id,label_name:id};return `<span>${esc(x.label_name)}<button onclick="removeCorrect('${qid}','${esc(id)}')">×</button></span>`}).join('')}
function renderCard(q,index){const r=currentReview(q.question_id),g=GROUP_META[q.perturbation_group],imgs=[imageBox(q.parent_stem_image_url,'父题题干图'),imageBox(q.stem_image_url,'当前题干图'),imageBox(q.parent_analysis_image_url,'父题解析图'),imageBox(q.analysis_image_url,'当前题解析图')].join('')||'<div class=no-image>该题没有可加载的题干/解析图片</div>',added=q.added_candidate_labels.length?`<div class=added><b>旧 knw_ids 新增候选：</b>${q.added_candidate_labels.map(x=>esc(x.label_name)).join('、')}</div>`:'';return `<article class=card id="q-${esc(q.question_id)}"><header class=card-head><span class=qid>#${index+1} · ID ${esc(q.question_id)}</span><span class="pill ${g.short}">${g.short} · ${esc(g.name)}</span><span class=meta>${esc(q.unit_type)} · 候选 ${q.base_candidate_count}→${q.augmented_candidate_count} · Jaccard ${q.selection_jaccard}</span></header><div class=body><div class=images>${imgs}</div>${added}<div class=compare><div class="run before"><h3>纯 Hybrid Top25</h3><div class=run-sub>橙色为仅本次选中；灰色为两次共有</div>${labelList(q.top25_labels,q.top25_only_labels.map(x=>x.label_id))}</div><div class="run after"><h3>Top25 + 旧 knw_ids</h3><div class=run-sub>橙色为仅本次选中；灰色为两次共有</div>${labelList(q.legacy_labels,q.legacy_only_labels.map(x=>x.label_id))}</div></div></div><section class=review><div class=review-head><h2>教师审核</h2><span class=saved>${r.reviewed_at?'已保存':'未审核'}</span></div><div class=review-note>合理多标允许；若两边各有部分正确，请选择“两边都有问题”并重选完整合理集合。</div><div class=choices>${DECISIONS.map(([v,l])=>`<button class="choice ${r.decision===v?'selected':''}" onclick="setDecision('${q.question_id}','${v}')">${l}</button>`).join('')}</div><div class=details><div class="${r.decision==='BOTH_WRONG'?'':'hidden'}"><div class=review-note>搜索并添加合理 Label（可多选）</div><div class=picker><input placeholder="输入Label名称、路径或ID" oninput="searchLabels('${q.question_id}',this.value)"><div id="suggest-${q.question_id}" class="suggestions hidden"></div></div><div class=selected-correct>${renderCorrect(q.question_id,r.correct_labels)}</div></div><textarea rows=2 placeholder="可选：错误原因或补充说明…" oninput="setNote('${q.question_id}',this.value)">${esc(r.note)}</textarea></div></section></article>`}
function render(){const app=document.getElementById('app'),pages=Math.ceil(filtered.length/PAGE_SIZE);if(!filtered.length){app.innerHTML='<div class="card empty-page">当前筛选没有题目</div>';document.getElementById('positionText').textContent='PAGE 0 / 0';return}page=Math.max(0,Math.min(page,pages-1));const start=page*PAGE_SIZE,rows=filtered.slice(start,start+PAGE_SIZE);document.getElementById('positionText').textContent=`PAGE ${page+1} / ${pages} · QUESTIONS ${start+1}–${start+rows.length} / ${filtered.length}`;document.getElementById('jumpInput').value=page+1;document.getElementById('jumpInput').max=pages;app.innerHTML=`<div class=page-grid>${rows.map((q,i)=>renderCard(q,start+i)).join('')}</div>`;renderProgress()}
function setDecision(qid,v){const r=currentReview(qid);r.decision=v;r.reviewed_at=new Date().toISOString();if(v!=='BOTH_WRONG')r.correct_labels=[];reviews[qid]=r;save();render()}function setNote(qid,v){const r=currentReview(qid);r.note=v;r.reviewed_at=new Date().toISOString();reviews[qid]=r;save()}function searchLabels(qid,v){const box=document.getElementById('suggest-'+qid),needle=v.trim().toLowerCase();if(!needle){box.classList.add('hidden');return}const found=CATALOG.filter(x=>(x.label_name+' '+x.label_path+' '+x.label_id).toLowerCase().includes(needle)).slice(0,20);box.innerHTML=found.map(x=>`<button onclick="addCorrect('${qid}','${esc(x.label_id)}')"><b>${esc(x.label_name)}</b><br><small>${esc(x.label_path)}</small></button>`).join('');box.classList.toggle('hidden',!found.length)}function addCorrect(qid,id){const r=currentReview(qid);if(!r.correct_labels.includes(id))r.correct_labels.push(id);r.reviewed_at=new Date().toISOString();reviews[qid]=r;save();render()}function removeCorrect(qid,id){const r=currentReview(qid);r.correct_labels=r.correct_labels.filter(x=>x!==id);reviews[qid]=r;save();render()}
function applyFilters(reset=true){filtered=DATA.filter(q=>{const reviewed=!!reviews[q.question_id]?.decision;if(groupFilter!=='ALL'&&q.perturbation_group!==groupFilter)return false;if(statusFilter==='UNREVIEWED'&&reviewed)return false;if(statusFilter==='REVIEWED'&&!reviewed)return false;if(query&&!JSON.stringify({question_id:q.question_id,top25:q.top25_labels,legacy:q.legacy_labels,added:q.added_candidate_labels}).toLowerCase().includes(query))return false;return true});if(reset)page=0;render();updateCounts()}function updateCounts(){const c={A:0,B:0,C:0};DATA.forEach(q=>c[GROUP_META[q.perturbation_group].short]++);document.getElementById('countALL').textContent=DATA.length;for(const k of ['A','B','C'])document.getElementById('count'+k).textContent=c[k]}function renderProgress(){const reviewed=filtered.filter(q=>reviews[q.question_id]?.decision).length,total=filtered.length;document.getElementById('progressText').textContent=`${reviewed} / ${total}`;document.getElementById('progressBar').style.width=total?`${reviewed/total*100}%`:'0%'}function movePage(d){page=Math.max(0,page+d);render();scrollTo({top:0,behavior:'smooth'})}function jumpPage(v){page=Math.max(0,Number(v)-1);render();scrollTo({top:0,behavior:'smooth'})}function openModal(src){document.getElementById('modalImg').src=src;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportRows(){return DATA.filter(q=>reviews[q.question_id]?.decision).map(q=>({question_id:q.question_id,perturbation_group:q.perturbation_group,top25_label_ids:q.top25_labels.map(x=>x.label_id),legacy_label_ids:q.legacy_labels.map(x=>x.label_id),...reviews[q.question_id]}))}function downloadJSONL(){download('biology-label-volatility-reviews.jsonl',exportRows().map(x=>JSON.stringify(x)).join('\n')+'\n','application/x-ndjson')}function downloadProgress(){download('biology-label-volatility-progress.json',JSON.stringify({version:2,exported_at:new Date().toISOString(),reviews},null,2))}function importProgress(){document.getElementById('importFile').click()}document.getElementById('importFile').addEventListener('change',async e=>{const x=JSON.parse(await e.target.files[0].text());reviews=x.reviews||x;save();applyFilters(false)});function clearAll(){if(confirm('确定清空本页全部审核记录？此操作不可撤销。')){reviews={};save();applyFilters()}}
document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-group]').forEach(x=>x.classList.remove('active'));b.classList.add('active');groupFilter=b.dataset.group;applyFilters()});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-status]').forEach(x=>x.classList.remove('active'));b.classList.add('active');statusFilter=b.dataset.status;applyFilters()});document.getElementById('searchInput').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();applyFilters()});updateCounts();applyFilters();
</script>
</body></html>
