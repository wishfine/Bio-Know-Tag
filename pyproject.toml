[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-know-tag"
version = "0.1.0"
description = "高中生物知识点标签验证与题目数据清洗工具"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
dense = ["transformers>=4.41,<5", "safetensors>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
